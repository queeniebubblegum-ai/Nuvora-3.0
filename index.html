<!DOCTYPE html>
<html lang="pt-BR" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuvora</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1F0F42">
    <link rel="apple-touch-icon" href="assets/icon-192.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .toggle-checkbox:checked { right: 0; border-color: var(--c-brand-medium); }
        .toggle-checkbox:checked + .toggle-label { background-color: var(--c-brand-medium); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-bg font-primary text-text-primary h-screen overflow-hidden flex flex-col transition-colors duration-300">

    <div id="toast-container" class="fixed top-6 left-1/2 -translate-x-1/2 flex flex-col gap-3 pointer-events-none items-center" style="z-index: 9999; max-width: 90vw;"></div>

    <input type="file" id="input-ofx-file" class="hidden" accept=".ofx" data-change="handleOFXUpload">

    <header class="shrink-0 h-[72px] bg-surface border-b border-border px-4 lg:px-[32px] flex justify-between items-center relative transition-colors duration-300" style="z-index: 50;">
        <div class="flex items-center gap-4 w-1/3">
            <button type="button" onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 text-text-primary">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-3">
                <img src="assets/logo.svg" alt="Logo Nuvora" class="h-[32px] w-auto object-contain">
                <h1 class="text-xl font-bold font-primary text-text-primary tracking-tight hidden sm:block">Nuvora</h1>
            </div>
        </div>

        <div class="w-1/3 hidden md:block"></div>

        <div class="flex items-center justify-end gap-4 w-1/3">
            <div class="relative cursor-pointer text-text-secondary hover:text-text-primary transition-colors p-2" onclick="Notifications.togglePanel()">
                <i class="fa-regular fa-bell text-xl"></i>
                <span id="notif-badge-mobile" class="absolute top-1 right-1 bg-danger text-white text-[8px] w-3.5 h-3.5 flex items-center justify-center rounded-full hidden font-mono">0</span>
            </div>

            <div class="h-8 w-px bg-border hidden sm:block"></div>

            <div class="relative anora-wrapper" onclick="document.getElementById('anora-menu').classList.toggle('hidden')">
                <div class="flex items-center gap-3 cursor-pointer group">
                    <div class="hidden sm:block text-right">
                        <span class="block text-sm font-bold text-text-primary leading-none mb-1">Anora</span>
                        <span class="block text-[10px] text-text-secondary leading-none">IA Financeira</span>
                    </div>
                    <img src="assets/anora.svg" alt="Avatar Anora" class="w-[40px] h-[40px] rounded-full object-cover shadow-soft group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-chevron-down text-xs text-text-secondary ml-1 group-hover:text-brand-medium transition-colors"></i>
                </div>

                <div id="anora-menu" class="hidden absolute right-0 top-[120%] w-64 bg-surface border border-border rounded-[16px] shadow-medium overflow-hidden transform origin-top-right transition-all" style="z-index: 998;">
                    <div class="p-4 border-b border-border bg-brand-deep text-white">
                        <p class="text-[11px] font-bold font-primary uppercase tracking-wider mb-2 text-brand-soft">Perfil da Mentoria</p>
                        <select id="anora-rigor-select" onclick="event.stopPropagation()" onchange="import('./db.js').then(m => m.Database.updateUser({ mentorStyle: this.value })); import('./utils.js').then(m => m.Utils.showToast('Personalidade da Anora atualizada!', 'success')); if(window.App) window.App.scheduleRender();" class="w-full bg-white/10 border border-white/20 rounded-[8px] text-xs p-2 outline-none focus:border-brand-medium text-white cursor-pointer font-medium">
                            <option class="text-text-primary" value="suave">🍃 Modo Suave</option>
                            <option class="text-text-primary" value="equilibrado" selected>⚖️ Modo Equilibrado</option>
                            <option class="text-text-primary" value="rigoroso">🎯 Foco Extremo (Rigoroso)</option>
                        </select>
                    </div>
                    <div class="p-2 flex flex-col gap-1">
                        <button data-action="openModal" data-modal="modal-chat-anora" class="flex items-center gap-3 text-left px-3 py-2.5 text-sm text-text-primary hover:bg-bg rounded-[8px] transition-colors font-medium">
                            <i class="fa-solid fa-wand-magic-sparkles w-4 text-brand-medium text-center"></i> Fazer uma Pergunta
                        </button>
                        <button data-action="openModal" data-modal="modal-historico-anora" class="flex items-center gap-3 text-left px-3 py-2.5 text-sm text-text-primary hover:bg-bg rounded-[8px] transition-colors font-medium">
                            <i class="fa-solid fa-clock-rotate-left w-4 text-text-secondary text-center"></i> Histórico de Insights
                        </button>
                        <div class="h-px bg-border my-1 mx-2"></div>
                        <button data-action="silenciarAnora" class="flex items-center gap-3 text-left px-3 py-2 text-xs text-text-secondary hover:text-danger hover:bg-danger/10 rounded-[8px] transition-colors font-bold">
                            <i class="fa-solid fa-bell-slash w-4 text-center"></i> Silenciar Alertas Hoje
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
        <aside id="sidebar" class="w-64 bg-brand-deep flex flex-col fixed inset-y-0 left-0 top-[72px] lg:static lg:top-0 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 border-r border-white/10" style="z-index: 45;">
            <nav class="flex-1 px-4 space-y-1 overflow-y-auto py-6 scrollbar-hide">
                
                <div class="pb-1">
                    <p class="px-4 text-[10px] font-bold uppercase tracking-widest text-white/50">Visão</p>
                </div>
                <button data-action="navigate" data-payload="Dashboard" id="nav-Dashboard" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-border-all w-5 text-center"></i> Dashboard
                </button>

                <div class="pt-5 pb-1">
                    <p class="px-4 text-[10px] font-bold uppercase tracking-widest text-white/50">Rotina</p>
                </div>
                <button data-action="navigate" data-payload="Transacoes" id="nav-Transacoes" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-arrow-right-arrow-left w-5 text-center"></i> Transações
                </button>
                <button data-action="navigate" data-payload="Agendamentos" id="nav-Agendamentos" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-regular fa-calendar-check w-5 text-center"></i> Agenda
                </button>

                <div class="pt-5 pb-1">
                    <p class="px-4 text-[10px] font-bold uppercase tracking-widest text-white/50">Estratégia</p>
                </div>
                <button data-action="navigate" data-payload="Metas" id="nav-Metas" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-bullseye w-5 text-center"></i> Metas
                </button>
                <button data-action="navigate" data-payload="Orcamento" id="nav-Orcamento" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i> Orçamento
                </button>
                <button data-action="navigate" data-payload="Relatorios" id="nav-Relatorios" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-chart-line w-5 text-center"></i> Relatórios
                </button>

                <div class="pt-5 pb-1">
                    <p class="px-4 text-[10px] font-bold uppercase tracking-widest text-white/50">Gestão</p>
                </div>
                <button data-action="navigate" data-payload="Contas" id="nav-Contas" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-wallet w-5 text-center"></i> Carteira
                </button>
                <button data-action="navigate" data-payload="Categorias" id="nav-Categorias" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-tags w-5 text-center"></i> Categorias
                </button>
                <button data-action="navigate" data-payload="Contatos" id="nav-Contatos" class="nav-item w-full text-left px-4 py-2.5 flex items-center gap-3 text-white/80 hover:text-white rounded-[12px] hover:bg-white/10 transition-colors text-sm font-medium">
                    <i class="fa-solid fa-address-book w-5 text-center"></i> Contatos
                </button>

            </nav>

            <div class="p-6 border-t border-white/10 space-y-2 shrink-0">
                <button data-action="navigate" data-payload="Configuracoes" id="nav-Configuracoes" class="flex items-center gap-3 text-white/80 hover:text-white hover:bg-white/10 rounded-[12px] text-sm font-medium w-full px-4 py-2.5 transition-colors mb-2">
                    <i class="fa-solid fa-gear w-5 text-center"></i> Configurações
                </button>
                <button onclick="toggleDarkMode()" class="flex items-center gap-3 text-white/80 hover:text-white hover:bg-white/10 rounded-[12px] text-sm font-medium w-full px-4 py-2.5 transition-colors">
                    <i class="fa-solid fa-moon w-5 text-center"></i> Tema Escuro
                </button>
                <input type="file" id="backup-input" class="hidden" accept=".json">
                <button data-action="exportBackup" class="flex items-center gap-3 text-white/80 hover:text-success hover:bg-white/10 rounded-[12px] text-sm font-medium w-full px-4 py-2.5 transition-colors">
                    <i class="fa-solid fa-download w-5 text-center"></i> Exportar Dados
                </button>
                <button onclick="document.getElementById('backup-input').click()" class="flex items-center gap-3 text-white/80 hover:text-brand-soft hover:bg-white/10 rounded-[12px] text-sm font-medium w-full px-4 py-2.5 transition-colors">
                    <i class="fa-solid fa-upload w-5 text-center"></i> Importar Dados
                </button>

                <div class="pt-4 mt-4 border-t border-white/10">
                    <div data-action="navigate" data-payload="Configuracoes" id="nav-Configuracoes-perfil" class="flex items-center gap-3 w-full px-3 py-2 rounded-[12px] hover:bg-white/10 transition-colors cursor-pointer group">
                        <img src="assets/perfil.svg" alt="Seu Perfil" class="w-10 h-10 rounded-full object-cover border-2 border-white/10">
                        <div class="flex-1 overflow-hidden">
                            <span class="block text-sm font-bold text-white truncate">Usuário</span>
                            <span class="block text-[10px] text-white/50 truncate font-mono"></span>
                        </div>
                        <i class="fa-solid fa-gear text-white/40 group-hover:text-white transition-colors text-xs"></i>
                    </div>
                </div>
            </div>
        </aside>

        <div id="mobile-overlay" class="fixed inset-0 bg-brand-deep/40 backdrop-blur-[2px] hidden lg:hidden" onclick="toggleSidebar()" style="z-index: 40;"></div>

        <main class="flex-1 overflow-y-auto relative w-full">
            <div id="main-content" class="p-4 lg:p-8 pb-20 space-y-6 animate-fadeIn max-w-[1400px] mx-auto"></div>
        </main>
    </div>

    <div class="fixed bottom-8 right-8 flex flex-col items-end" style="z-index: 30;">
        
        <div id="speed-dial-menu" class="flex flex-col items-end gap-3 opacity-0 translate-y-4 pointer-events-none transition-all duration-300 mb-3">
            
            <button data-action="openModal" data-modal="modal-transacao" data-type="receita" onclick="toggleSpeedDial()" class="flex items-center gap-3 group/item focus:outline-none cursor-pointer">
                <span class="bg-surface text-text-primary text-xs font-bold py-1.5 px-3 rounded-[8px] shadow-soft group-hover/item:scale-105 transition-transform">Receita</span>
                <div class="w-11 h-11 bg-success text-white rounded-full shadow-soft flex items-center justify-center text-sm group-hover/item:scale-110 active:scale-95 transition-transform">
                    <i class="fa-solid fa-arrow-down"></i>
                </div>
            </button>

            <button data-action="openModal" data-modal="modal-transacao" data-type="despesa" onclick="toggleSpeedDial()" class="flex items-center gap-3 group/item focus:outline-none cursor-pointer">
                <span class="bg-surface text-text-primary text-xs font-bold py-1.5 px-3 rounded-[8px] shadow-soft group-hover/item:scale-105 transition-transform">Despesa</span>
                <div class="w-11 h-11 bg-danger text-white rounded-full shadow-soft flex items-center justify-center text-sm group-hover/item:scale-110 active:scale-95 transition-transform">
                    <i class="fa-solid fa-arrow-up"></i>
                </div>
            </button>

        </div>

        <button id="btn-flutuante-main" onclick="toggleSpeedDial()" class="w-14 h-14 bg-brand-medium text-white rounded-full shadow-medium flex items-center justify-center text-xl hover:bg-brand-dark active:scale-95 transition-all focus:outline-none z-10">
            <i id="speed-dial-icon" class="fa-solid fa-plus transition-transform duration-300"></i>
        </button>
    </div>

    <script>
        function toggleSpeedDial() {
            const menu = document.getElementById('speed-dial-menu');
            const icon = document.getElementById('speed-dial-icon');
            
            if (menu.classList.contains('opacity-0')) {
                // Abre o menu e gira o ícone
                menu.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                menu.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
                icon.classList.add('rotate-45');
            } else {
                // Fecha o menu e volta o ícone ao normal
                menu.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                menu.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
                icon.classList.remove('rotate-45');
            }
        }

        // UX: Fecha o menu automaticamente se o usuário clicar fora da área dele
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('speed-dial-menu');
            const mainBtn = document.getElementById('btn-flutuante-main');
            
            // Se o menu estiver aberto, e o clique não for no botão principal nem dentro do menu
            if (!menu.classList.contains('opacity-0') && !menu.contains(event.target) && !mainBtn.contains(event.target)) {
                toggleSpeedDial();
            }
        });
    </script>
    <div id="notif-overlay" class="fixed inset-0 bg-brand-deep/30 backdrop-blur-[2px] hidden transition-opacity" onclick="Notifications.togglePanel()" style="z-index: 997;"></div>
    <div id="notif-drawer" class="fixed inset-y-0 right-0 w-full max-w-sm bg-surface shadow-medium transform translate-x-full transition-transform duration-300 flex flex-col border-l border-border" style="z-index: 998;">
        <div class="px-6 py-5 border-b border-border flex justify-between items-center bg-surface flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-brand-medium rounded-[8px] flex items-center justify-center text-white text-sm">
                    <i class="fa-solid fa-bell"></i>
                </div>
                <h3 class="text-lg font-bold text-text-primary">Notificações <span id="notif-count-title" class="bg-danger text-white text-[10px] font-bold px-2 py-0.5 rounded-full ml-1 hidden font-mono">0</span></h3>
            </div>
            <button onclick="Notifications.togglePanel()" class="text-text-secondary hover:text-text-primary w-8 h-8 flex items-center justify-center rounded-[8px] hover:bg-bg transition-colors"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="flex border-b border-border bg-surface flex-shrink-0">
            <button onclick="Notifications.switchTab('alertas')" id="tab-notif-alertas" class="flex-1 py-3 text-sm font-bold border-b-2 border-text-primary text-text-primary transition-colors">Alertas</button>
            <button onclick="Notifications.switchTab('config')" id="tab-notif-config" class="flex-1 py-3 text-sm font-medium border-b-2 border-transparent text-text-secondary hover:text-text-primary transition-colors">Configurações</button>
        </div>

        <div id="notif-content" class="flex-1 overflow-y-auto bg-surface p-0"></div>
    </div>
    
    <div id="modals-container"></div>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden');
            }
        }
    </script>
    <script type="module">
        import { Modals } from './cmp-modals.js';
        
        // Injetar os modais no DOM de forma estática antes do arranque da App
        document.getElementById('modals-container').innerHTML = Modals.getHTML();

        import { App } from './app.js';
        import { Notifications } from './notifications.js';
        window.App = App;
        window.Notifications = Notifications;
    </script>
</body>
</html>
