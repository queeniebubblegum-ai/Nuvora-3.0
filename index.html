        <button type="button" id="btn-flutuante-main" onclick="toggleSpeedDial()" aria-controls="speed-dial-menu" aria-expanded="false" aria-label="Abrir menu de novo lançamento" class="w-14 h-14 bg-brand-medium text-white rounded-full shadow-medium flex items-center justify-center text-xl hover:bg-brand-dark active:scale-95 transition-all focus:outline-none z-10">

    <script>
        window.resetDashboardQuickAction = function() {
            const menu = document.getElementById('speed-dial-menu');
            const contextual = document.getElementById('speed-dial-contextual');
            if (!menu || !contextual) return;
            contextual.hidden = true;
            delete contextual.dataset.action;
            menu.querySelectorAll('button:not(#speed-dial-contextual)').forEach(item => { item.hidden = false; item.tabIndex = -1; });
        };

        function toggleSpeedDial() {
            const menu = document.getElementById('speed-dial-menu');
            const icon = document.getElementById('speed-dial-icon');
            const mainBtn = document.getElementById('btn-flutuante-main');
            if (!menu || !icon || !mainBtn) return;

            const menuItems = menu.querySelectorAll('button');
            const isOpening = menu.classList.contains('opacity-0');

            if (isOpening) {
                // Abre o menu e gira o ícone. Os itens só entram na ordem de
                // tabulação enquanto o menu está visível, inclusive no mobile.
                menu.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
                menu.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
                icon.classList.add('rotate-45');
                menuItems.forEach(item => item.tabIndex = item.hidden ? -1 : 0);
                requestAnimationFrame(() => {
                    // O usuário pode ter fechado o menu antes do próximo frame.
                    if (!menu.classList.contains('opacity-0')) { const firstVisible = Array.from(menuItems).find(item => !item.hidden); if (firstVisible) firstVisible.focus(); else menuItems[0]?.focus(); }
                });
            } else {
                // Fecha o menu e volta o ícone ao normal.
                menu.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
                menu.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
                icon.classList.remove('rotate-45');
                menuItems.forEach(item => item.tabIndex = -1);
            }

            menu.setAttribute('aria-hidden', String(!isOpening));
            mainBtn.setAttribute('aria-expanded', String(isOpening));
            mainBtn.setAttribute('aria-label', isOpening ? 'Fechar menu de novo lançamento' : 'Abrir menu de novo lançamento');
        }

        // Escape fecha somente o speed dial aberto e devolve o foco ao botão
        // que controla o menu; não interfere em modais ou outros atalhos.
        document.addEventListener('keydown', function(event) {
            if (event.key !== 'Escape') return;
            const menu = document.getElementById('speed-dial-menu');
            const mainBtn = document.getElementById('btn-flutuante-main');
            if (!menu || menu.classList.contains('opacity-0')) return;
            event.preventDefault();
            toggleSpeedDial();
            mainBtn?.focus();
        });

        // UX: Fecha o menu automaticamente se o usuário clicar fora da área dele
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('speed-dial-menu');
            const mainBtn = document.getElementById('btn-flutuante-main');
            
            // Se o menu estiver aberto, e o clique não for no botão principal nem dentro do menu
            if (!menu.classList.contains('opacity-0') && !menu.contains(event.target) && !mainBtn.contains(event.target) && !event.target?.closest?.('.nv-dashboard-primary-action')) {
                toggleSpeedDial();
            }
        });
    </script>

            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');

                sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden');
            }
        }
