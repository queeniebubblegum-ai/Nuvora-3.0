<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avenera — shell v4</title>
<!-- Fontes do redesign v4 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- styles.css gerado por: npm run build (a partir de input.css) -->
<link rel="stylesheet" href="./styles.css">
</head>
<body class="min-h-screen">

<!-- ============================================================
     SHELL v4 — sidebar (desktop) / drawer (mobile) + topbar + dock+FAB
     Integra com o Router existente: Router.navigate(page)
     e com eventos de data-action já tratados em evt-click.js.
     ============================================================ -->

<!-- ===== Overlay do drawer (mobile) ===== -->
<div id="drawer-overlay" class="fixed inset-0 z-40 bg-black/40 opacity-0 pointer-events-none transition-opacity md:hidden" data-action="drawer"></div>

<!-- ===== Sidebar (desktop) / Drawer (mobile) ===== -->
<aside id="sidebar"
       class="fixed md:static z-50 top-0 left-0 h-full w-72 bg-surface border-r border-border
              flex flex-col -translate-x-full md:translate-x-0 transition-transform duration-200">
  <!-- Logo -->
  <div class="flex items-center gap-3 px-5 h-16 border-b border-border">
    <div class="w-9 h-9 rounded-r2 bg-action flex items-center justify-center text-white font-display font-bold">A</div>
    <div>
      <p class="font-display font-semibold text-text leading-tight">Avenera</p>
      <p class="text-[11px] text-muted">finanças pessoais</p>
    </div>
    <button class="md:hidden ml-auto text-muted" data-action="drawer" aria-label="Fechar menu">✕</button>
  </div>

  <!-- Navegação — data-page = páginas válidas do Router -->
  <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1" aria-label="Principal">
    <a class="nav-item active" data-page="Dashboard" href="#dashboard">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
      Início
    </a>
    <a class="nav-item" data-page="Transacoes" href="#transacoes">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h13l-2 8H8L6 4H3M9 19h.01M17 19h.01M14 4v6m-3-3h6"/></svg>
      Lançamentos
    </a>
    <a class="nav-item" data-page="Contas" href="#contas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>
      Contas & cartões
    </a>
    <a class="nav-item" data-page="Agendamentos" href="#agendamentos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
      Agenda
    </a>
    <a class="nav-item" data-page="Metas" href="#metas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      Metas & reservas
    </a>
    <a class="nav-item" data-page="Orcamento" href="#orcamento">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Orçamento
    </a>
    <a class="nav-item" data-page="Relatorios" href="#relatorios">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6"/></svg>
      Relatórios
    </a>
    <a class="nav-item" data-page="Contatos" href="#contatos">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4h5M16 8h5M18.5 1.5v5"/></svg>
      Contatos
    </a>
    <a class="nav-item" data-page="Categorias" href="#categorias">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      Categorias
    </a>
    <a class="nav-item" data-page="Planejamento" href="#planejamento">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
      Planejamento
    </a>

    <div class="pt-4 mt-3 border-t border-border">
      <a class="nav-item" data-page="Anora" href="#anora">
        <span class="w-[18px] h-[18px] rounded-full bg-gradient-to-br from-action to-violet inline-block"></span>
        Anora · mentora
      </a>
      <a class="nav-item" data-page="Configuracoes" href="#configuracoes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Ajustes
      </a>
    </div>
  </nav>

  <!-- Perfil (rodapé da sidebar) -->
  <div class="p-3 border-t border-border">
    <button class="nav-item w-full" data-action="profile">
      <img src="assets/perfil.svg" alt="" class="w-8 h-8 rounded-full bg-surface-2">
      <span class="flex-1 text-left min-w-0">
        <span class="block text-sm font-semibold text-text truncate" data-user-name>Minha conta</span>
        <span class="block text-[11px] text-muted truncate">ver perfil</span>
      </span>
    </button>
  </div>
</aside>

<!-- ===== Coluna principal ===== -->
<div class="flex-1 flex flex-col min-w-0">

  <!-- Topbar -->
  <header class="sticky top-0 z-30 h-16 bg-page/80 backdrop-blur border-b border-border flex items-center gap-3 px-4 md:px-6">
    <button class="md:hidden btn-ghost !px-2.5" data-action="drawer" aria-label="Abrir menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <h1 class="font-display text-lg md:text-xl font-semibold text-text flex-1 truncate" data-page-title>Início</h1>

    <!-- Busca global -->
    <label class="hidden md:flex items-center gap-2 bg-surface border border-border rounded-pill px-3.5 py-2 w-64 focus-within:border-action">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-muted"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="bg-transparent outline-none text-sm w-full placeholder:text-muted-2" placeholder="Buscar lançamentos…" data-action="search">
    </label>

    <button class="btn-ghost !px-2.5 relative" data-action="notifications" aria-label="Notificações">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-danger"></span>
    </button>
    <button class="btn-ghost !px-2.5" data-action="theme" aria-label="Alternar tema">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <!-- Conteúdo da página (renderizado pelo renderer.js existente) -->
  <main id="content" class="flex-1 px-4 md:px-6 py-6 pb-24 md:pb-8 max-w-content w-full mx-auto">
    <!-- <div id="view"></div> -->
  </main>
</div>

<!-- ===== Dock inferior mobile + FAB central ===== -->
<nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-surface/95 backdrop-blur border-t border-border flex items-stretch justify-around h-16 pb-[env(safe-area-inset-bottom)]" aria-label="Navegação inferior">
  <button class="mobile-nav-item nav-item active flex-col !gap-1 !py-1.5 flex-1 justify-center" data-page="Dashboard" aria-label="Início">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
    <small class="text-[10px]">Início</small>
  </button>
  <button class="mobile-nav-item nav-item flex-col !gap-1 !py-1.5 flex-1 justify-center" data-page="Transacoes" aria-label="Lançamentos">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h13l-2 8H8L6 4H3M9 19h.01M17 19h.01"/></svg>
    <small class="text-[10px]">Lançamentos</small>
  </button>
  <!-- espaçador para o FAB -->
  <span class="w-14 shrink-0"></span>
  <button class="mobile-nav-item nav-item flex-col !gap-1 !py-1.5 flex-1 justify-center" data-page="Agendamentos" aria-label="Agenda">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
    <small class="text-[10px]">Agenda</small>
  </button>
  <button class="mobile-nav-item nav-item flex-col !gap-1 !py-1.5 flex-1 justify-center" data-page="Contas" aria-label="Contas">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></svg>
    <small class="text-[10px]">Contas</small>
  </button>
</nav>

<!-- FAB central (sobrepõe o dock) -->
<button class="fab md:hidden" style="bottom: calc(2rem + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);"
        data-action="new-transaction" aria-label="Nova transação">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
</button>

<script>
/* ===== Cola de integração com o app existente =====
   - Router.navigate(page) já existe em router.js
   - data-action é tratado por evt-click.js (adicionar: drawer, theme, new-transaction)
   - Se preferir autônomo, o trecho abaixo funciona sem o resto do app. */
(function () {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('drawer-overlay');
  const openDrawer = (open) => {
    sidebar.classList.toggle('-translate-x-full', !open);
    overlay.classList.toggle('opacity-0', !open);
    overlay.classList.toggle('pointer-events-none', !open);
  };
  document.querySelectorAll('[data-action="drawer"]').forEach(el =>
    el.addEventListener('click', () => openDrawer(sidebar.classList.contains('-translate-x-full'))));

  // Navegação por data-page → integra com Router; fecha drawer e atualiza estado active
  document.querySelectorAll('[data-page]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const page = el.dataset.page;
      if (window.Router) Router.navigate(page);
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
      const title = el.textContent.trim().split('\n')[0];
      const t = document.querySelector('[data-page-title]'); if (t) t.textContent = title;
      openDrawer(false);
    });
  });

  // Toggle de tema (persistido como o app já faz: localStorage 'nuvora_theme')
  document.querySelector('[data-action="theme"]')?.addEventListener('click', () => {
    const dark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem('nuvora_theme', dark ? 'dark' : 'light'); } catch (_) {}
  });
})();
</script>
</body>
</html>
